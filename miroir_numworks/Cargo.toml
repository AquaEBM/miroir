[package]

name = "miroir_numworks"
version = "0.1.0"
edition = "2024"

[dependencies]

miroir = { path = "../miroir", default-features = false,  features = ["libm"] }
miroir_shapes = { path = "../miroir_shapes", optional = true }

eadk = { git = "https://github.com/AquaEBM/eadk_rs" }

num-traits = { version = "0.2", default-features = false }
impl-trait-for-tuples = "0.2"

[features]

default = ["nalgebra", "alloc", "shapes"]
nalgebra = ["miroir/nalgebra"]
alloc = ["miroir/alloc"]
shapes = ["dep:miroir_shapes"]